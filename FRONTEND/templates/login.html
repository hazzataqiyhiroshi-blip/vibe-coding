<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | TRO Lab Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login">
<form class="login-box" method="post">
  {% if S.logo %}<img src="{{ url_for('static', filename='uploads/' + S.logo) }}" alt="logo">{% else %}<div class="ico">🤖</div>{% endif %}
  <h2>TRO LAB MANAGER</h2>
  <p class="muted">{{ S.nama_lab }}</p>
  {% for c, m in get_flashed_messages(with_categories=true) %}<div class="flash {{ 'err' if c == 'err' }}">{{ m }}</div>{% endfor %}
  <input name="username" placeholder="Username" required autofocus>
  <input type="password" name="password" placeholder="Password" required>
  <button>Masuk</button>
  <a href="{{ url_for('register') }}">Belum punya akun? Daftar</a>
</form>
</body></html>
